name: CI/CD Employee Management API (prod-v1)

on:
  workflow_dispatch:
  push:
    branches:
      - prod-v1

jobs:

  # ✅ Step 1: Generate Environment File
  generate_env:
    runs-on: ubuntu-22.04
    environment: prod-v1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Production Environment File
        run: |
          cp env/{env}.application.env.example env/prod-v1.application.env
          sed -i "s|DATABASE_MYSQL_NAME=.*|DATABASE_MYSQL_NAME=\"${{ secrets.DATABASE_MYSQL_NAME }}\"|g" env/prod-v1.application.env
          sed -i "s|DATABASE_MYSQL_USERNAME=.*|DATABASE_MYSQL_USERNAME=\"${{ secrets.DATABASE_MYSQL_USERNAME }}\"|g" env/prod-v1.application.env
          sed -i "s|DATABASE_MYSQL_PASSWORD=.*|DATABASE_MYSQL_PASSWORD=\"${{ secrets.DATABASE_MYSQL_PASSWORD }}\"|g" env/prod-v1.application.env
          sed -i "s|DATABASE_CACHE_REDIS_USERNAME=.*|DATABASE_CACHE_REDIS_USERNAME=\"${{ secrets.DATABASE_CACHE_REDIS_USERNAME }}\"|g" env/prod-v1.application.env
          sed -i "s|DATABASE_CACHE_REDIS_PASSWORD=.*|DATABASE_CACHE_REDIS_PASSWORD=\"${{ secrets.DATABASE_CACHE_REDIS_PASSWORD }}\"|g" env/prod-v1.application.env
          sed -i "s|DATABASE_CACHE_REDIS_DATABASE=.*|DATABASE_CACHE_REDIS_DATABASE=\"${{ secrets.DATABASE_CACHE_REDIS_DATABASE }}\"|g" env/prod-v1.application.env
          sed -i "s|JWT_SECRET_KEY=.*|JWT_SECRET_KEY=\"${{ secrets.JWT_SECRET_KEY }}\"|g" env/prod-v1.application.env

      - name: Verify Environment File
        run: |
          if grep -v '^#' env/prod-v1.application.env | grep -q '="[^"]*"'; then
            echo "✅ All secrets are correctly set."
          else
            echo "❌ ERROR: Some secrets are empty!"
            exit 1
          fi

      - name: Upload .env File as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-env
          path: env/prod-v1.application.env

  # ✅ Step 2: Build Docker Image and Push to Registry
  build_and_push_image:
    runs-on: ubuntu-22.04
    environment: prod-v1
    needs: generate_env
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download .env File Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-env
          path: env

      - name: Load Environment Variables
        uses: cardinalby/export-env-action@v2
        with:
          envFile: env/prod-v1.application.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/employee-management-api
          labels: |
            org.opencontainers.image.title=${{ env.APPS_NAME }}
            org.opencontainers.image.version=${{ env.APPS_VERSION }}
            org.opencontainers.image.description=${{ env.APPS_DESCRIPTION }}
            org.opencontainers.image.authors=Rodericus Ifo Krista

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/employee-management-api:${{ env.APPS_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENV=prod-v1
            PORT=${{ env.SERVER_PORT }}

  # ✅ Step 3: Test the Docker Image (Run Container)
  test_image:
    runs-on: ubuntu-22.04
    environment: prod-v1
    needs: build_and_push_image
    steps:
      - name: Download .env File Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-env
          path: env
      
      - name: Load Environment Variables
        uses: cardinalby/export-env-action@v2
        with:
          envFile: env/prod-v1.application.env
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull the Docker Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/employee-management-api:${{ env.APPS_VERSION }}

      - name: Run Docker Container for Testing
        run: |
          docker run -d --name test-container -p ${{ env.SERVER_PORT }}:${{ env.SERVER_PORT }} ${{ secrets.DOCKER_USERNAME }}/employee-management-api:${{ env.APPS_VERSION }}
          echo "Waiting for container health check to pass..."
          timeout 60s bash -c 'until [ "$(docker inspect -f {{.State.Status}} test-container)" == "running" ]; do sleep 5; done' || exit 1
          sleep 5
          docker logs test-container

      - name: Stop and Remove Test Container
        run: |
          docker stop test-container || true
          docker rm test-container || true